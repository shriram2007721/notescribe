# =====================================================================
# NoteScribe: CI/CD pipeline (Azure Pipelines, multi-stage YAML)
#
#   Stage 1  CI  (Continuous Integration)
#            install -> lint -> type-check -> build -> verify -> publish artifact
#   Stage 2  CD  (Continuous Delivery)
#            [manual approval on the "notescribe-production" environment]
#            download artifact -> package versioned release zip + checksum -> publish
#            (No Azure subscription needed. Runs entirely in free Azure DevOps.)
#
# Governance (configured in the portal, see GOVERNANCE.md):
#   - main is protected by a branch policy: PR + 1 reviewer + this pipeline must pass.
#   - CD pauses until a human clicks "Approve" on the production environment.
# =====================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)

# Run CI/CD whenever main changes (i.e. after a PR is merged).
trigger:
  branches:
    include: [main]
  paths:
    exclude: ["*.md"]

# Azure Repos ignores YAML `pr:` triggers. PR validation is enforced by the
# "Build validation" branch policy instead (GOVERNANCE.md, Part 1).
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - name: NODE_VERSION
    value: "20.x"
  - name: npm_config_cache
    value: $(Pipeline.Workspace)/.npm

stages:
  # -------------------------------------------------------------------
  - stage: CI
    displayName: "Continuous Integration (Build & Test)"
    jobs:
      - job: Build
        displayName: Install, lint, test, build
        steps:
          - checkout: self
            fetchDepth: 1

          - task: NodeTool@0
            displayName: Use Node.js $(NODE_VERSION)
            inputs:
              versionSpec: $(NODE_VERSION)

          - task: Cache@2
            displayName: Restore npm cache
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: 'npm | "$(Agent.OS)"'
              path: $(npm_config_cache)

          - script: npm ci
            displayName: Install dependencies (npm ci)

          - script: npm run lint
            displayName: "Quality: ESLint"

          - script: npx tsc --noEmit
            displayName: "Quality: TypeScript type-check"

          - script: npm test
            displayName: "Quality: Unit tests (Vitest)"

          # prebuild copies the in-browser AI runtime into public/vendor; output lands in ./out
          - script: npm run build
            displayName: Build Next.js static export
            env:
              NEXT_TELEMETRY_DISABLED: 1

          - script: |
              set -e
              for f in index.html note.html community.html sw.js manifest.json staticwebapp.config.json vendor/transformers/transformers.min.js; do
                test -f "out/$f" || { echo "##vso[task.logissue type=error]Missing build output: $f"; exit 1; }
              done
              echo "Build output verified."
            displayName: "Smoke test: verify build output"

          - publish: out
            artifact: site
            displayName: Publish build artifact (site)

  # -------------------------------------------------------------------
  - stage: CD
    displayName: "Continuous Delivery (Approved Release)"
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      # A "deployment" job targets an Environment; the approval check on that
      # environment pauses the run here until someone clicks Approve.
      - deployment: Release
        displayName: Package approved release
        environment: notescribe-production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: site
                  displayName: Download build artifact

                - task: ArchiveFiles@2
                  displayName: Package site as zip
                  inputs:
                    rootFolderOrFile: $(Pipeline.Workspace)/site
                    includeRootFolder: false
                    archiveType: zip
                    archiveFile: $(Pipeline.Workspace)/release/notescribe-$(Build.BuildNumber).zip

                - script: |
                    cd "$(Pipeline.Workspace)/release"
                    sha256sum *.zip > SHA256SUMS.txt
                    cat SHA256SUMS.txt
                  displayName: Generate checksum

                - publish: $(Pipeline.Workspace)/release
                  artifact: release
                  displayName: Publish approved release package
